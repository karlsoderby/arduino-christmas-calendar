name: Deploy calendar to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build encrypted site content
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          test -n "$SITE_PASSWORD" || { echo "SITE_PASSWORD secret is missing"; exit 1; }
          pip install cryptography
          python3 site/build.py

      - name: Assemble published files
        run: |
          mkdir -p _site
          cp -r site zips _site/
          cp index.html _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
