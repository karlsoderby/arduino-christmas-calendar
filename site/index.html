<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arduino Christmas Calendar</title>
    <link rel="stylesheet" href="style.css?v=dev" />
  </head>
  <body>
    <div id="snow" aria-hidden="true"></div>

    <section id="lock" hidden>
      <form id="lock-form">
        <div class="lock-icon" aria-hidden="true">🎁</div>
        <h1>Arduino Christmas Calendar</h1>
        <p>Enter the password to unwrap the calendar.</p>
        <input id="lock-password" type="password" autocomplete="current-password" aria-label="Password" required />
        <button type="submit">Unwrap 🎄</button>
        <p id="lock-error" class="lock-error" hidden>Wrong password, try again!</p>
      </form>
    </section>

    <main id="calendar-view" hidden>
      <div id="calendar">
        <img src="calendar.jpg" alt="Arduino Christmas Calendar with 25 doors" draggable="false" />
        <div id="doors"></div>
      </div>
      <p class="hint">Click "Start Here!" to begin, then open a door each day!</p>
    </main>

    <div id="curtain" aria-hidden="true"></div>
    <div id="particles" aria-hidden="true"></div>

    <section id="reader" hidden>
      <div class="garland" aria-hidden="true"></div>
      <nav class="reader-nav">
        <button id="back" type="button">← Calendar</button>
        <div class="reader-nav-days">
          <button id="prev" type="button">‹ Previous</button>
          <button id="next" type="button">Next ›</button>
        </div>
      </nav>
      <article>
        <header class="reader-header">
          <div id="badge" class="badge"></div>
          <h1 id="title"></h1>
          <a id="download" class="download" download>⬇ Download App (.zip)</a>
        </header>
        <div id="content" class="markdown"></div>
      </article>
    </section>

    <script src="vendor/marked.min.js"></script>
    <script src="content.js?v=dev"></script>
    <script src="unlock.js?v=dev"></script>
  </body>
</html>
